<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="slurp" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yale Landing &mdash; Leasing Brochure (PDF)</title>
<!-- /pdf is the short link used in email and print. It sends the visitor straight to the
     brochure in the browser's own PDF viewer, which is the only thing that renders a PDF
     reliably on every phone. The page is only seen if the redirect is blocked. -->
<meta http-equiv="refresh" content="0; url=../assets/lease/yale-landing-leasing-brochure.pdf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0B1B33; color:#EDE8E4; font-family:"Inter",system-ui,sans-serif; text-align:center; padding:2rem; }
  .eyebrow { font-family:"Archivo",sans-serif; font-weight:800; font-size:.7rem; letter-spacing:.24em;
             text-transform:uppercase; color:rgba(237,232,228,.6); margin:0 0 1rem; }
  h1 { font-family:"Archivo",sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:-.02em;
       font-size:clamp(1.2rem,3.4vw,1.7rem); margin:0 0 .6rem; }
  p { color:rgba(237,232,228,.68); margin:0 0 1.8rem; font-size:.95rem; }
  a.btn { display:inline-block; font-family:"Archivo",sans-serif; font-weight:700; font-size:.78rem;
          letter-spacing:.08em; text-transform:uppercase; padding:1rem 2rem;
          background:#fff; color:#0B1B33; border:1.5px solid #fff; text-decoration:none; }
  a.btn:hover { background:transparent; color:#fff; }
  .small { margin-top:2.2rem; font-size:.8rem; color:rgba(237,232,228,.5); }
  .small a { color:inherit; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Yale Landing &middot; 2500 Yale Blvd. SE</p>
  <h1>Opening the leasing brochure</h1>
  <p>If it does not open on its own, use the button below.</p>
  <a id="pdf" class="btn" href="../assets/lease/yale-landing-leasing-brochure.pdf">Open the brochure (PDF)</a>
  <p class="small">Ted Bustos &middot; <a href="tel:+15059489171">505.948.9171</a></p>
</main>
<script>
  // The href above is rewritten by the build for whichever host this is deployed to,
  // so resolve the redirect target from it at runtime rather than hard-coding a path.
  location.replace(document.getElementById("pdf").href);
</script>
</body>
</html>
